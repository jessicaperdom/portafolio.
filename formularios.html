 <header> 

    
 <meta charset="UTF-8"> 

 <title>Formulario | llenar formulario</title> 

<section> <h2>Contacto (Contact)</h2> <p>Si deseas comunicarte con Jessica Perdomo, 

    completa el siguiente formulario.</p> <form> <div> <label for="nombre">Nombre 

    (Name)</label> <input id="nombre" type="text" required placeholder="Ej: Jessica 

    Perdomo"> </div> 

    <div> 

     <label for="correo">Correo electrónico (Email)</label> 

     <input id="correo" type="email" required placeholder="Jessica@email.com"> 

    </div 

    <div> 

        <label for="telefono">Teléfono (Phone)</label> 

        <input id="telefono" type="tel" placeholder="+57 3125101330"> 

       </div> 

       <div> 

        <label for="motivo">Motivo del contacto (Reason)</label> 

        <select id="motivo" required> 

        <option value="">Selecciona una opción</option> 

        <option value="cotizacion">Cotización de proyecto</option> 

        <option value="colaboracion">Colaboración</option> 

        <option value="empleo">Oportunidad laboral</option> 

        </select> 

       </div> 

       <div> 

        <label for="mensaje">Mensaje (Message)</label> 

        <textarea id="mensaje" required minlength="20" maxlength="300" 

        placeholder="Describe tu solicitud con mínimo 20 caracteres"></textarea> 

       </div> 

       <div> 

        <input id="acepto" type="checkbox" required> 

        <label for="acepto">Acepto el tratamiento de datos (I agree)</label> 

       </div> 

       v> 

 <button type="submit">Enviar mensaje (Submit)</button> 

</div> 

</form> </section> 


 <p><a href="portafolio.html">Volver a portafolio</a></p> 

 </footer>
